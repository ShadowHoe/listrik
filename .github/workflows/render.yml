name: Render video
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm i puppeteer
      - run: node render.mjs
      - run: ffmpeg -framerate 30 -i frames/%05d.png -i voice.mp3 -i sfx.wav -filter_complex "[1:a]volume=1.0[a1];[2:a]volume=0.45[a2];[a1][a2]amix=inputs=2:normalize=0:duration=longest[a]" -map 0:v -map "[a]" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
